const byId=id=>document.getElementById(id);

const cache=new Map();
function image(url){

function plate(id,img,index,columns,flip){
 const canvas=byId(id),ctx=canvas.getContext('2d');

}

function choose(k,i=0){

}
function seek(i){playing=false;frame=(i+selected().durationsMs.length)%selected().durationsMs.length;elapsed=0;render()}
