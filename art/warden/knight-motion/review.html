 plate('cw',sheet,frame,c.columns,mirror.checked);
 byId('error').textContent=[src,sheet].some(im=>im.complete&&!im.naturalWidth)?'시트를 읽을 수 없습니다. ZIP 전체를 압축 해제한 뒤 다시 열어 주세요.':'';
 byId('refInfo').textContent=r.label+' · 비교 셀 '+(rid+1);
 byId('frameInfo').textContent=c.name+' · '+(frame+1)+' / '+c.durationsMs.length+' · '+c.durationsMs[frame]+' ms';
 byId('play').textContent=playing?'일시정지':'비교 재생';
 for(const [i,b] of [...byId('strip').children].entries())b.setAttribute('aria-current',String(i===frame));
 const a=notes(c,frame),m=c.metrics[frame];
 byId('verdict').textContent=a.length?a.map(v=>v.level).join(' · '):'동작 전체 관찰';
 byId('verdict').className=a.some(v=>v.level!=='의도된 연출')?'issue':'';
 byId('frameNote').textContent=a.length?a.map(v=>v.text).join(' '):c.audit.summary;
 byId('metrics').textContent='불투명 픽셀 '+m.pixels+'개 · 연결 영역 '+m.parts.length+'개 · '+(m.bounds?'셀 경계 잘림 없음':'완전 투명');
}
function choose(k,i=0){
 key=k;clip.value=k;frame=i;elapsed=0;const c=selected(),r=c.ref;
 byId('subject').textContent=c.name+' 감사 결과';byId('summary').textContent='선택한 프레임과 인접 프레임의 관찰';byId('previousPairs').src='pairs-before/'+key+'.png';byId('pairs').src='pairs/'+key+'.png';byId('pairs').alt=c.name+' 전체 프레임, 위 기사 아래 워든';byId('hkObservation').textContent=c.audit.comparison.knight;byId('cwObservation').textContent=c.audit.comparison.warden;
 const source=document.createElement('a');source.textContent='기사 원본 출처';source.href=r.source;source.target='_blank';source.rel='noopener';
 byId('comparison').replaceChildren((r.surrogate?'유사 자세 비교 · ':'대응 동작 비교 · ')+r.label+'　',source,r.note?'　'+r.note:' ');
 byId('strip').replaceChildren(...c.durationsMs.map((_,n)=>{const b=document.createElement('button');b.textContent=n+1;b.dataset.flag=notes(c,n).some(v=>v.level!=='의도된 연출');b.onclick=()=>seek(n);return b}));render()
}
function seek(i){playing=false;frame=(i+selected().durationsMs.length)%selected().durationsMs.length;elapsed=0;render()}
for(const [k,c] of Object.entries(DATA.clips)){
 clip.add(new Option(c.name,k));
 for(const n of c.audit.observations){const b=document.createElement('button');b.textContent=c.name+' '+n.start+'–'+n.end;b.title=n.text;b.onclick=()=>{playing=false;choose(k,n.start-1)};byId('index').append(b)}
}
byId("zoom").onchange=()=>document.documentElement.style.setProperty("--canvas-width",208*Number(byId("zoom").value)+"px");clip.onchange=()=>choose(clip.value);mirror.onchange=render;
byId('prev').onclick=()=>seek(frame-1);byId('next').onclick=()=>seek(frame+1);
byId('play').onclick=()=>{playing=!playing;last=performance.now();render()};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();seek(frame+(e.key==='ArrowLeft'?-1:1))}});
function tick(now){if(playing){const c=selected();elapsed+=Math.min(now-last,150)*Number(speed.value);let changed=false;
 const duration=()=>c.durationsMs[frame]+(!c.loop&&frame===c.durationsMs.length-1?300:0);
 while(elapsed>=duration()){elapsed-=duration();frame=(frame+1)%c.durationsMs.length;changed=true}if(changed)render()}last=now;requestAnimationFrame(tick)}
choose(key,frame);requestAnimationFrame(tick);
</script></html>
