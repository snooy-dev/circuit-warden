const byId=id=>document.getElementById(id);
const clip=byId('clip'),speed=byId('speed'),mirror=byId('mirror');
let key='ground-attack', frame=2, elapsed=0, last=performance.now(), playing=false;
const cache=new Map();
function image(url){
 if(!cache.has(url)){const img=new Image();cache.set(url,img);img.onload=render;img.onerror=render;img.src=url}
 return cache.get(url)
}
function plate(id,img,index,columns,flip){
 const canvas=byId(id),ctx=canvas.getContext('2d');
 ctx.fillStyle='#263442';ctx.fillRect(0,0,208,154);
 ctx.fillStyle='#617385';ctx.fillRect(0,117,208,1);
 if(!img.complete||!img.naturalWidth)return;
 ctx.imageSmoothingEnabled=false;ctx.save();ctx.translate(104,117);
 ctx.scale(flip?-1:1,1);ctx.drawImage(img,(index%columns)*256,Math.floor(index/columns)*224,256,224,-128,-136,256,224);ctx.restore()
}
const selected=()=>DATA.clips[key];

 for(const [i,b] of [...byId('strip').children].entries())b.setAttribute('aria-current',String(i===frame));

}
function seek(i){playing=false;frame=(i+selected().durationsMs.length)%selected().durationsMs.length;elapsed=0;render()}
for(const [k,c] of Object.entries(DATA.clips)){
 clip.add(new Option(c.name,k));
 for(const n of c.audit.observations){const b=document.createElement('button');b.textContent=c.name+' '+n.start+'–'+n.end;b.title=n.text;b.onclick=()=>{playing=false;choose(k,n.start-1)};byId('index').append(b)}
}
byId("zoom").onchange=()=>document.documentElement.style.setProperty("--canvas-width",208*Number(byId("zoom").value)+"px");clip.onchange=()=>choose(clip.value);mirror.onchange=render;
byId('prev').onclick=()=>seek(frame-1);byId('next').onclick=()=>seek(frame+1);
byId('play').onclick=()=>{playing=!playing;last=performance.now();render()};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();seek(frame+(e.key==='ArrowLeft'?-1:1))}});
function tick(now){if(playing){const c=selected();elapsed+=Math.min(now-last,150)*Number(speed.value);let changed=false;
 const duration=()=>c.durationsMs[frame]+(!c.loop&&frame===c.durationsMs.length-1?300:0);
 while(elapsed>=duration()){elapsed-=duration();frame=(frame+1)%c.durationsMs.length;changed=true}if(changed)render()}last=now;requestAnimationFrame(tick)}
choose(key,frame);requestAnimationFrame(tick);
</script></html>
