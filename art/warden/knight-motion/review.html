const ctx=stage.getContext('2d');ctx.imageSmoothingEnabled=false;
let index=0,time=0,playing=true,last=performance.now(),sheet=new Image();
for(const [key,entry] of Object.entries(manifest.clips))clip.add(new Option(entry.name,key));
function config(){return manifest.clips[clip.value]}
function total(){return config().durationsMs.length}
function display(){
 const c=config(), flipped=mirror.checked && clip.value!=='teleport-front';
 ctx.clearRect(0,0,290,168);ctx.fillStyle='#58697a';ctx.fillRect(0,123,290,1);
 if(sheet.complete && sheet.naturalWidth){
 ctx.save();ctx.translate(145,123);ctx.scale(flipped?-1:1,1);
 ctx.drawImage(sheet,index%c.columns*256,Math.floor(index/c.columns)*224,256,224,-128,-136,256,224);ctx.restore()}
 info.value=(index+1)+' / '+total()+' 프레임 · '+c.durationsMs[index]+' ms';
}
function load(){index=0;time=0;sheet=new Image();sheet.onload=display;sheet.src=config().sheet;display()}
function toggle(value){playing=value;play.textContent=value?'일시정지':'재생'}
function step(delta){toggle(false);index=(index+total()+delta)%total();time=0;display()}
function tick(now){if(playing){time+=Math.min(now-last,100)*Number(speed.value);const c=config();while(time>=c.durationsMs[index]+(!c.loop&&index===total()-1?300:0)){time-=c.durationsMs[index]+(!c.loop&&index===total()-1?300:0);index=(index+1)%total()}}last=now;display();requestAnimationFrame(tick)}
